[project]
name = "clues-by-sam-solver"
version = "0.1.0"
description = "Solver for Clues by Sam puzzles"
authors = [
    {name = "safina57"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "playwright (>=1.56.0,<2.0.0)",
    "z3-solver (>=4.15.4.0,<5.0.0.0)",
    "pydantic-ai (>=1.22.0,<2.0.0)",
    "openai (>=2.8.1,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.1"
pre-commit = "^4.5.0"
black = "^25.11.0"
flake8 = "^7.3.0"
poethepoet = "^0.38.0"

[tool.poe.tasks]
start = "python main.py"
